name: CICD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Backend/**'
      - 'Frontend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Backend/**'
      - 'Frontend/**'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Folder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Full history needed so paths-filter can diff against the correct previous commit
      - name: Resolve previous commit for push events
        id: base_ref
        if: github.event_name == 'push'
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # For push events, diff against the resolved SHA of the first parent commit instead of
          # relying on github.event.before, which can be the null SHA (e.g. on the first tracked push)
          # and cause paths-filter to silently fall back to a merge-base comparison that reports 0 changes.
          # For pull_request events, leave base unset so paths-filter uses its own PR-base-branch API lookup.
          base: ${{ github.event_name == 'push' && steps.base_ref.outputs.sha || '' }}
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Frontend/**'

  test-backend:
    name: Backend Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('Backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-
      - name: Install Dependencies
        working-directory: Backend
        run: npm ci
      - name: Run Unit & Integration Tests
        working-directory: Backend
        run: npm run test:coverage
      - name: Verify coverage report for Sonar
        working-directory: Backend
        run: |
          test -f coverage/lcov.info
          echo "Backend coverage report ready:"
          wc -l coverage/lcov.info
          head -n 5 coverage/lcov.info
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: Backend/coverage
          if-no-files-found: ignore

  test-frontend:
    name: Frontend Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install Dependencies
        working-directory: Frontend
        run: npm ci
      - name: Run Unit Tests
        working-directory: Frontend
        run: npm run test:coverage
      - name: Verify coverage report for Sonar
        working-directory: Frontend
        run: |
          test -f coverage/lcov.info
          echo "Frontend coverage report ready:"
          wc -l coverage/lcov.info
          head -n 5 coverage/lcov.info
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: Frontend/coverage
          if-no-files-found: ignore

  # sonarqube-backend:
  #   name: SonarQube - Backend
  #   needs: [detect-changes, test-backend]
  #   if: needs.detect-changes.outputs.backend == 'true'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
  #       with:
  #         fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
  #     - name: Download coverage report
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: backend-unit-coverage
  #         path: Backend/coverage
  #     - name: Confirm Sonar coverage input
  #       working-directory: Backend
  #       run: |
  #         test -f coverage/lcov.info
  #         echo "Sonar will import:"
  #         ls -la coverage/lcov.info
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
  #       with:
  #         projectBaseDir: Backend
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
  #         SONAR_SCANNER_OPTS: "-Xmx8192m"

  sonarqube-frontend:
    name: SonarQube - Frontend
    needs: [detect-changes, test-frontend]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-coverage
          path: Frontend/coverage
      - name: Confirm Sonar coverage input
        working-directory: Frontend
        run: |
          test -f coverage/lcov.info
          echo "Sonar will import:"
          ls -la coverage/lcov.info
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          projectBaseDir: Frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_SCANNER_OPTS: "-Xmx2048m"

  build-and-deploy:
    needs:
      - detect-changes
      - test-backend
      - test-frontend
      - sonarqube-frontend
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.test-backend.result == 'success' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.sonarqube-frontend.result == 'success' || needs.sonarqube-frontend.result == 'skipped')
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        working-directory: Backend
        run: npm install
      - name: Set file name variable
        id: set_var
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          # github.ref_name is a branch name on push ("develop") but "<pr>/merge"
          # on pull_request. That slash made zip read the prefix as a directory
          # and fail with "Could not create output file", so the packaging check
          # went red on every backend PR while nothing was actually wrong.
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          FILE_NAME="$TIMESTAMP-isoplus-backend-package-$SAFE_REF-${{ github.sha }}.zip"
          VERSION_LABEL="$TIMESTAMP-${{ github.sha }}"
          echo "PACKAGE_FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          echo "VERSION_LABEL=$VERSION_LABEL" >> $GITHUB_ENV

      - name: Generate Deployment Package
        working-directory: Backend
        run: zip -r $PACKAGE_FILE_NAME .

      # --- Everything below only runs on an actual push to main/develop (post-merge), not on pull_request ---

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        if: github.event_name == 'push'
        working-directory: Backend
        run: aws s3 cp $PACKAGE_FILE_NAME s3://isoplus-backend-deploy-bucket-isoplus-v1/$PACKAGE_FILE_NAME

      - name: Create a new version on EBS from package on S3 - PROD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws elasticbeanstalk create-application-version --application-name "isoplus-be-prod" --version-label $VERSION_LABEL --source-bundle S3Bucket="isoplus-backend-deploy-bucket-isoplus-v1",S3Key="$PACKAGE_FILE_NAME"

      - name: Update environment with the new vesion - PROD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws elasticbeanstalk update-environment --environment-name isoplus-be-prod-blue --version-label $VERSION_LABEL

      - name: Create a new version on EBS from package on S3 - DEV
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          aws elasticbeanstalk create-application-version --application-name "isoplus-be-dev" --version-label $VERSION_LABEL --source-bundle S3Bucket="isoplus-backend-deploy-bucket-isoplus-v1",S3Key="$PACKAGE_FILE_NAME"

      - name: Update environment with the new vesion - DEV
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          aws elasticbeanstalk update-environment --environment-name isoplus-be-dev-blue --version-label $VERSION_LABEL
