  # The backend package is Backend/ including node_modules (~743M unzipped), far
  # too large to hand between jobs as an upload/download artifact. So the two jobs
  # below each build their own zip and are mutually exclusive on the trigger event:
  # exactly one of them runs per event, and neither duplicates the other's work.
  #
  #   pull_request     -> package-backend only  (build check, no AWS)
  #   workflow_dispatch-> package-backend only  (build check, no AWS)
  #   push main/develop-> deploy-backend only   (build + deploy)
  #
  # They were previously one job named "build-and-deploy" whose AWS steps carried
  # `if: github.event_name == 'push'`. Nothing ever deployed from a PR, but the job
  # name and its six skipped steps read like a deployment had run, which repeatedly
  # led people to think preview PRs were shipping to Elastic Beanstalk.

  package-backend:
    name: Package Backend (build check)
    needs:
      - detect-changes
      - test-backend
      - test-frontend
    if: >
      always() &&
      github.event_name != 'push' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.test-backend.result == 'success' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        working-directory: Backend
        run: npm install
      - name: Set file name variable
        id: set_var
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          # github.ref_name is a branch name on push ("develop") but "<pr>/merge"
          # on pull_request. That slash made zip read the prefix as a directory
          # and fail with "Could not create output file", so the packaging check
          # went red on every backend PR while nothing was actually wrong.
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          FILE_NAME="$TIMESTAMP-isoplus-backend-package-$SAFE_REF-${{ github.sha }}.zip"
          echo "PACKAGE_FILE_NAME=$FILE_NAME" >> $GITHUB_ENV

      - name: Generate Deployment Package
        working-directory: Backend
        run: zip -r $PACKAGE_FILE_NAME .

  deploy-backend:
    name: Deploy Backend
    needs:
      - detect-changes
      - test-backend
      - test-frontend
    if: >
      always() &&
      github.event_name == 'push' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.test-backend.result == 'success' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        working-directory: Backend
        run: npm install
      - name: Set file name variable
        id: set_var
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          # Kept in sync with package-backend above. On push github.ref_name is a
          # plain branch name, but the substitution is harmless and keeps the two
          # jobs producing identically-named packages.
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          FILE_NAME="$TIMESTAMP-isoplus-backend-package-$SAFE_REF-${{ github.sha }}.zip"
          VERSION_LABEL="$TIMESTAMP-${{ github.sha }}"
          echo "PACKAGE_FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          echo "VERSION_LABEL=$VERSION_LABEL" >> $GITHUB_ENV

      - name: Generate Deployment Package
        working-directory: Backend
        run: zip -r $PACKAGE_FILE_NAME .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        working-directory: Backend
        run: aws s3 cp $PACKAGE_FILE_NAME s3://isoplus-backend-deploy-bucket-isoplus-v1/$PACKAGE_FILE_NAME

      - name: Create a new version on EBS from package on S3 - PROD
        if: github.ref == 'refs/heads/main'
        run: |
          aws elasticbeanstalk create-application-version --application-name "isoplus-be-prod" --version-label $VERSION_LABEL --source-bundle S3Bucket="isoplus-backend-deploy-bucket-isoplus-v1",S3Key="$PACKAGE_FILE_NAME"

      - name: Update environment with the new vesion - PROD
        if: github.ref == 'refs/heads/main'
        run: |
          aws elasticbeanstalk update-environment --environment-name isoplus-be-prod-blue --version-label $VERSION_LABEL

      - name: Create a new version on EBS from package on S3 - DEV
        if: github.ref == 'refs/heads/develop'
        run: |
          aws elasticbeanstalk create-application-version --application-name "isoplus-be-dev" --version-label $VERSION_LABEL --source-bundle S3Bucket="isoplus-backend-deploy-bucket-isoplus-v1",S3Key="$PACKAGE_FILE_NAME"

      - name: Update environment with the new vesion - DEV
        if: github.ref == 'refs/heads/develop'
        run: |
          aws elasticbeanstalk update-environment --environment-name isoplus-be-dev-blue --version-label $VERSION_LABEL
