name: CICD

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Backend/**'
      
jobs:
  build-and-deploy:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        working-directory: Backend
        run: npm install
      - name: Set file name variable
        id: set_var
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          FILE_NAME="$TIMESTAMP-isoplus-backend-package-${{ github.ref_name }}-${{ github.sha }}.zip"
          echo "PACKAGE_FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          
      - name: Generate Deployment Package
        working-directory: Backend 
        run: zip -r $PACKAGE_FILE_NAME .
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        working-directory: Backend 
        run: aws s3 cp $PACKAGE_FILE_NAME s3://isoplus-backend-deploy-bucket-isoplus-v1/$PACKAGE_FILE_NAME
        
      - name: Create a new version on EBS from package on S3
        run: | 
          aws elasticbeanstalk create-application-version --application-name "isoplus-backend" --version-label ${{ github.sha }} --source-bundle S3Bucket="isoplus-backend-deploy-bucket-isoplus-v1",S3Key="$PACKAGE_FILE_NAME"
      
      - name: Update environment with the new vesion
        run: |
          aws elasticbeanstalk update-environment --environment-name isoplus-backend-blue --version-label ${{ github.sha }}
      
