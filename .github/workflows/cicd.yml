name: CICD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Backend/**'
      - 'Frontend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Backend/**'
      - 'Frontend/**'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Folder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Full history needed so paths-filter can diff against the correct previous commit
      - name: Resolve previous commit for push events
        id: base_ref
        if: github.event_name == 'push'
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # For push events, diff against the resolved SHA of the first parent commit instead of
          # relying on github.event.before, which can be the null SHA (e.g. on the first tracked push)
          # and cause paths-filter to silently fall back to a merge-base comparison that reports 0 changes.
          # For pull_request events, leave base unset so paths-filter uses its own PR-base-branch API lookup.
          base: ${{ github.event_name == 'push' && steps.base_ref.outputs.sha || '' }}
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Frontend/**'

  test-backend:
    name: Backend Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('Backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-
      - name: Install Dependencies
        working-directory: Backend
        run: npm ci
      - name: Run Unit & Integration Tests
        working-directory: Backend
        run: npm run test:coverage
      - name: Verify coverage report for Sonar
        working-directory: Backend
        run: |
          test -f coverage/lcov.info
          echo "Backend coverage report ready:"
          wc -l coverage/lcov.info
          head -n 5 coverage/lcov.info
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: Backend/coverage
          if-no-files-found: ignore

  test-frontend:
    name: Frontend Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install Dependencies
        working-directory: Frontend
        run: npm ci
      - name: Run Unit Tests
        working-directory: Frontend
        run: npm run test:coverage
      - name: Verify coverage report for Sonar
        working-directory: Frontend
        run: |
          test -f coverage/lcov.info
          echo "Frontend coverage report ready:"
          wc -l coverage/lcov.info
          head -n 5 coverage/lcov.info
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: Frontend/coverage
          if-no-files-found: ignore

