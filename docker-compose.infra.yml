name: isoplus-infra

# Shared datastores for ISO+ Portal local development.
#
# This stack is started ONCE per machine and is shared by the main clone and
# every git worktree. Only `mongo` and `redis` live here; the app containers
# (backend, frontend) live in docker-compose.yml and are started once per
# worktree, joining the network created below.
#
#   npm run dev:up                   starts this automatically if needed
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml down      (-v also wipes data)
#
# See docs/local-development.md and docs/worktrees.md.

services:
  mongo:
    image: mongo:7
    container_name: isoplus-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - isoplus
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: isoplus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - isoplus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# App stacks join this by name as an external network. The explicit `name:`
# keeps it stable regardless of which compose project creates it.
networks:
  isoplus:
    name: isoplus-net

volumes:
  mongo-data:
  redis-data:
